arqué</ns0:tspan></ns0:text><ns0:text x="410" y="145" font-size="22"><ns0:tspan x="410" dy="0">Infrastructure</ns0:tspan></ns0:text><ns0:text x="650" y="145" font-size="22"><ns0:tspan x="650" dy="0">Énergie</ns0:tspan></ns0:text><ns0:text x="1390" y="85" font-size="24"><ns0:tspan x="1390" dy="0">Données de roulement</ns0:tspan><ns0:tspan x="1390" dy="45">Pente, arrêts, vitesse, électrification</ns0:tspan></ns0:text><ns0:text x="190" y="342" font-size="26"><ns0:tspan x="190" dy="0">Données du</ns0:tspan><ns0:tspan x="190" dy="32">matériel roulant</ns0:tspan></ns0:text><ns0:text x="190" y="526" font-size="26"><ns0:tspan x="190" dy="0">Modélisation du</ns0:tspan><ns0:tspan x="190" dy="36">système embarqué</ns0:tspan></ns0:text><ns0:text x="630" y="526" font-size="26"><ns0:tspan x="630" dy="0">Modélisation de</ns0:tspan><ns0:tspan x="630" dy="36">l’infrastructure</ns0:tspan></ns0:text><ns0:text x="1130" y="510" font-size="26"><ns0:tspan x="1130" dy="0">Puissance consommée</ns0:tspan><ns0:tspan x="1130" dy="36">en roulement :</ns0:tspan><ns0:tspan x="1130" dy="36">Pbus, a</ns0:tspan></ns0:text><ns0:text x="1130" y="771" font-size="26"><ns0:tspan x="1130" dy="0">Consommation et</ns0:tspan><ns0:tspan x="1130" dy="36">récupération d’énergie :</ns0:tspan><ns0:tspan x="1130" dy="36">E, Erecup</ns0:tspan></ns0:text><ns0:text x="645" y="891" font-size="26"><ns0:tspan x="645" dy="0">Impacts du</ns0:tspan><ns0:tspan x="645" dy="36">scénario n</ns0:tspan></ns0:text><ns0:text x="1540" y="290" font-size="20"><ns0:tspan x="1540" dy="0">Données de roulement</ns0:tspan><ns0:tspan x="1540" dy="30">disponibles ?</ns0:tspan></ns0:text><ns0:text x="1570" y="462" font-size="24"><ns0:tspan x="1570" dy="0">Modélisation du roulement</ns0:tspan></ns0:text><ns0:text x="1570" y="510" font-size="21"><ns0:tspan x="1570" dy="0">Accélération :</ns0:tspan><ns0:tspan x="1570" dy="33">distance entre arrêts, a max, P max</ns0:tspan><ns0:tspan x="1570" dy="33">Croisière :</ns0:tspan><ns0:tspan x="1570" dy="33">P max, i, distance entre arrêts</ns0:tspan><ns0:tspan x="1570" dy="33">Décélération :</ns0:tspan><ns0:tspan x="1570" dy="33">V max, a min, P min (optionnel)</ns0:tspan></ns0:text><ns0:text x="1260" y="285" font-size="22"><ns0:tspan x="1260" dy="0">Oui</ns0:tspan></ns0:text><ns0:text x="1570" y="410" font-size="22"><ns0:tspan x="1570" dy="0">Non</ns0:tspan></ns0:text></ns0:g></ns0:svg>