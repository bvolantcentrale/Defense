<script>
(function(){
 const S=[
  {id:1,code:"01",title:"Introduction",color:"#440F76",subparts:["Introduction"]},
  {id:2,code:"02",title:"Organisation / parties prenantes",color:"#942C80",subparts:["Modélisation du réseau","Analyse du réseau d’acteurs","Clustering et réorganisation"]},
  {id:3,code:"03",title:"ACV & ADMC",color:"#E44F64",subparts:["Modélisation","ADMC","Validation"]},
  {id:4,code:"04",title:"Conclusions et perspectives",color:"#FEA973",subparts:["Conclusions et perspectives"]}
 ];
 const POS={1:[[50,50]],2:[[35,50],[65,50]],3:[[50,28],[32,65],[68,65]],4:[[34,34],[66,34],[34,66],[66,66]]};

 function initializeNavigation() {
  const deck = window.Reveal;
  // Deplacer les libelles ACV sans redimensionner leurs glyphes.
  deck.configure({ autoAnimateMatcher: function(from, to) {
   return this.getAutoAnimatePairs(from, to).map(pair => {
    if (pair.to.matches('.acv-morph-label')) {
     pair.options = { scale: false, styles: ['color'], measure: element => {
      const box = element.getBoundingClientRect();
      return { x: box.left, y: box.top, width: box.width, height: box.height };
     }};
    } else if (pair.to.matches('[data-id="decision-steps-morph"]')) {
     pair.options = { measure: element => {
      const box = element.getBoundingClientRect();
      return { x: box.left, y: box.top, width: box.width, height: box.height };
     }};
    }
    return pair;
   });
  }});
  const slides = deck.getSlides();
  const mainSlides = slides.filter(slide => !slide.matches('.appendix-slide'));
  const printMode = new URLSearchParams(location.search).has('print-pdf');
  const visibleOn = slide => slide && slide.dataset.part &&
   !slide.matches('.cover, .end-slide, .appendix-slide');

  // Ajuster la grande matrice aux deux dimensions sans couper les cellules.
  function fitActorTables() {
   slides.forEach(slide => slide.querySelectorAll('.actor-matrix-small').forEach(box => {
    const width = box.clientWidth, height = box.clientHeight;
    if (!width || !height) return;
    const table = box.querySelector('table');
    table.style.transform = 'none';
    const measure = value => {
     table.style.width = `${value}px`;
     return table.offsetWidth / table.offsetHeight;
    };
    // Les colonnes restent automatiques ; chercher un rapport largeur/hauteur
    // proche de celui du cadre pour utiliser au mieux la place disponible.
    const ratio = width / height;
    let low = width, high = width;
    while (measure(high) < ratio && high < width * 16) high *= 2;
    for (let i = 0; i < 12; i++) {
     const mid = (low + high) / 2;
     if (measure(mid) < ratio) low = mid;
     else high = mid;
    }
    measure(high);
    const scale = Math.min(1, width / table.offsetWidth, height / table.offsetHeight);
    table.style.transform = `scale(${scale})`;
   }));
  }

  // Les contenus des slides conservent Auto-Animate ; le template est independant.
  slides.forEach(slide => {
   if (!printMode) slide.setAttribute('data-auto-animate', 'true');
   const part = S.find(part => part.id === Number(slide.dataset.part));
   if (part) slide.style.setProperty('--accent', part.color);
   if (slide.matches('.research-agenda')) {
    const count = document.createElement('div');
    count.className = 'rail-count summary-slide-count';
    count.innerHTML = `<span class="rail-count-current">${String(mainSlides.indexOf(slide) + 1).padStart(2, '0')}</span><span class="rail-count-total"> / ${String(mainSlides.length).padStart(2, '0')}</span>`;
    slide.appendChild(count);
   }
  });

  function createTemplate() {
   const template = document.createElement('div');
   template.className = 'phd-template';
   template.innerHTML = `
    <div class="phd-location">
     <span class="phd-location-code"></span><span class="phd-location-part"></span>
    </div>
    <div class="phd-map">${S.map(part => `
     <div class="part-unit" data-part-id="${part.id}" style="--part-color:${part.color}">
      <div class="part-disc">${part.subparts.map((_, index) => `
       <span class="sub-node" style="left:${POS[part.subparts.length][index][0]}%;top:${POS[part.subparts.length][index][1]}%"></span>
      `).join('')}</div>
     </div>`).join('')}
    </div>
    <div class="phd-rail">
     <div class="rail-heading"><div class="rail-part"></div><div class="rail-subpart"></div></div>
     <div class="rail-track"><div class="rail-fill"></div><span class="rail-start"></span>
      <span class="rail-end"></span><span class="rail-cursor"></span></div>
    </div>
    <div class="rail-count"><span class="rail-count-current"></span><span class="rail-count-total"></span></div>`;
   return template;
  }

  // Mise a jour des valeurs uniquement : les noeuds fixes ne sont jamais recrees.
  function updateTemplate(template, slide) {
   template.hidden = !visibleOn(slide);
   if (template.hidden) return;
   const part = S.find(part => part.id === Number(slide.dataset.part));
   const unnumbered = slide.classList.contains('unnumbered-subpart') ||
    ([2, 3].includes(part.id) && slide.matches('.references-slide, .perspectives-slide'));
   const sub = unnumbered ? part.subparts.length + 1 :
    Math.max(1, Math.min(Number(slide.dataset.subpart || 1), part.subparts.length));
   const subTitle = unnumbered ? '' : (slide.classList.contains('references-slide') ? 'Références' : part.subparts[sub - 1]);
   template.querySelector('.phd-location').hidden = unnumbered;
   const partSlides = mainSlides.filter(item => visibleOn(item) && item.dataset.part === slide.dataset.part);
   const progress = partSlides.length <= 1 ? 100 : partSlides.indexOf(slide) / (partSlides.length - 1) * 100;
   template.style.setProperty('--accent', part.color);
   template.style.setProperty('--part-progress', `${progress}%`);
   const setText = (selector, value) => {
    const node = template.querySelector(selector);
    if (node.textContent !== value) node.textContent = value;
   };
   setText('.phd-location-code', unnumbered ? '' : `${part.id}.${sub}`);
   setText('.phd-location-part', subTitle);
   setText('.rail-part', `Part ${part.id}`);
   setText('.rail-subpart', part.title);
   setText('.rail-count-current', String(mainSlides.indexOf(slide) + 1).padStart(2, '0'));
   setText('.rail-count-total', ` / ${String(mainSlides.length).padStart(2, '0')}`);
   template.querySelectorAll('.part-unit').forEach(unit => {
    const id = Number(unit.dataset.partId);
    unit.classList.toggle('past', id < part.id);
    unit.classList.toggle('active', id === part.id);
    unit.querySelectorAll('.sub-node').forEach((node, index) => {
     node.classList.toggle('done', id < part.id || (id === part.id && index + 1 < sub));
     node.classList.toggle('current', id === part.id && index + 1 === sub);
     node.classList.toggle('future', id > part.id || (id === part.id && index + 1 > sub));
    });
   });
  }

  // Les fragments pilotent le focus sans modifier la geometrie ni les couleurs.
  document.querySelectorAll('.indicator-results-table').forEach(resultsTable => {
  const resultsSlide = resultsTable && resultsTable.closest('section');
  if (resultsTable) {
   let actor = '';
   resultsTable.querySelectorAll('tbody tr').forEach(row => {
    const id = row.querySelector('[data-cell^="A"]');
    if (id) actor = id.textContent.trim();
    row.dataset.actor = actor;
   });
  }
  function refreshActorFocus() {
   if (!resultsSlide) return;
   const steps = [...resultsSlide.querySelectorAll('.indicator-focus-step.visible')];
   const focus = printMode || !steps.length ? 'all' : steps[steps.length - 1].dataset.actorFocus;
   const groups = {
    region: ['A1'],
    top: ['A1', 'A2', 'A5', 'A11', 'A3', 'A6', 'A4', 'A12', 'A9'],
    dgitm: ['A13']
   };
   const labels = {
    all: 'Tous les acteurs',
    region: 'Focus : Région',
    top: 'Focus : Acteurs majeurs',
    dgitm: 'Focus : DGITM'
   };
   resultsTable.querySelectorAll('tbody tr').forEach(row => {
    row.classList.toggle('actor-muted', focus !== 'all' && !groups[focus].includes(row.dataset.actor));
   });
   resultsSlide.querySelector('.indicator-focus-label').textContent = labels[focus];
  }
  deck.on('fragmentshown', refreshActorFocus);
  deck.on('fragmenthidden', refreshActorFocus);
  deck.on('slidechanged', refreshActorFocus);
  refreshActorFocus();
  });

  const overlay = createTemplate();
  overlay.classList.add('phd-template-live');
  deck.getRevealElement().appendChild(overlay);

  // Meme repere et meme echelle que les slides, sans participer a leurs transitions.
  function alignTemplate() {
   if (printMode || deck.isOverview()) return;
   const canvas = deck.getSlidesElement();
   const bounds = canvas.getBoundingClientRect();
   const rootBounds = deck.getRevealElement().getBoundingClientRect();
   Object.assign(overlay.style, {
    width: `${canvas.offsetWidth}px`, height: `${canvas.offsetHeight}px`,
    left: `${bounds.left - rootBounds.left}px`, top: `${bounds.top - rootBounds.top}px`,
    transform: `scale(${deck.getScale()})`
   });
  }

  // Réserver la hauteur réelle des notices complètes, y compris pour l'impression.
  function fitReferences() {
   slides.forEach(slide => {
    const footer = slide.querySelector('.slide-references');
    if (footer && footer.offsetHeight) {
     slide.style.setProperty('--references-space', `${Math.max(110, footer.offsetHeight + 32)}px`);
    }
   });
  }

  function refresh() {
   fitReferences();
   fitActorTables();
   const wasHidden = overlay.hidden;
   overlay.classList.toggle('no-motion', wasHidden);
   updateTemplate(overlay, deck.getCurrentSlide());
   if (printMode || deck.isOverview()) overlay.hidden = true;
   alignTemplate();
   // Evite un trajet du curseur depuis la derniere slide visible apres une annexe.
   if (wasHidden) {
    void overlay.offsetHeight;
    overlay.classList.remove('no-motion');
   }
  }

  // L'export PDF dispose d'une copie statique propre a chaque page.
  function preparePrint() {
   fitReferences();
   fitActorTables();
   slides.filter(visibleOn).forEach(slide => {
    if (slide.querySelector('.phd-template-print')) return;
    const template = createTemplate();
    template.classList.add('phd-template-print');
    updateTemplate(template, slide);
    slide.appendChild(template);
   });
  }
  if (printMode) preparePrint();
  window.addEventListener('beforeprint', preparePrint);
  window.addEventListener('afterprint', () => {
   if (!printMode) document.querySelectorAll('.phd-template-print').forEach(node => node.remove());
  });
  // Relier les disques de l'ouverture et du sommaire à la carte de navigation.
  let mapMorphLayer = null;
  function finishMapMorph() {
   if (mapMorphLayer) mapMorphLayer.remove();
   mapMorphLayer = null;
   overlay.classList.remove('map-morphing');
   document.querySelectorAll('.cover-map-morphing').forEach(slide => slide.classList.remove('cover-map-morphing'));
  }
  function localPosition(node, ancestor) {
   let left = 0, top = 0;
   for (let item = node; item && item !== ancestor; item = item.offsetParent) {
    left += item.offsetLeft;
    top += item.offsetTop;
   }
   return {left, top};
  }
  function morphOpeningMap(event) {
   finishMapMorph();
   const previous = event.previousSlide;
   const current = event.currentSlide;
   const incoming = previous && visibleOn(previous) && current.matches('.research-agenda') &&
    current.querySelector('.agenda-disc.visible');
   const outgoing = previous && previous.matches('.defense-cover, .research-agenda') &&
    visibleOn(current) && previous.querySelector('.agenda-part.visible, .agenda-disc.visible');
   if (printMode || (!incoming && !outgoing) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    refresh();
    return;
   }
   const agenda = incoming ? current : previous;
   const sourceDiscs = [...(incoming ? overlay.querySelectorAll('.part-disc') : previous.querySelectorAll('.agenda-disc'))];
   // Mesurer la navigation avant que le changement de diapo ne la masque.
   const sources = sourceDiscs.map(source => {
    const style = getComputedStyle(source);
    return {
     clone: source.cloneNode(true), position: localPosition(source, incoming ? overlay : previous),
     width: source.offsetWidth, height: source.offsetHeight,
     border: style.border, color: style.borderColor,
     opacity: incoming ? getComputedStyle(source.parentElement).opacity : '1',
     dots: [...source.children].map(dot => {
      const style = getComputedStyle(dot);
      return {width: style.width, height: style.height, background: style.backgroundColor, opacity: style.opacity};
     })
    };
   });
   refresh();
   const destinationDiscs = [...(incoming ? current.querySelectorAll('.agenda-disc') : overlay.querySelectorAll('.part-disc'))];
   const layer = document.createElement('div');
   layer.className = 'opening-map-morph';
   Object.assign(layer.style, {
    width: overlay.style.width, height: overlay.style.height,
    left: overlay.style.left, top: overlay.style.top, transform: overlay.style.transform
   });
   deck.getRevealElement().appendChild(layer);
   mapMorphLayer = layer;
   const timing = {duration: 850, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards'};
   const animations = sources.map((source, index) => {
    const destination = destinationDiscs[index];
    const target = localPosition(destination, incoming ? current : overlay);
    const targetStyle = getComputedStyle(destination);
    const clone = source.clone;
    clone.className = 'opening-morph-disc';
    Object.assign(clone.style, {
     left: `${source.position.left}px`, top: `${source.position.top}px`,
     width: `${source.width}px`, height: `${source.height}px`,
     border: source.border, color: source.color, boxSizing: 'border-box'
    });
    [...clone.children].forEach((dot, dotIndex) => {
     const start = source.dots[dotIndex];
     const nextStyle = getComputedStyle(destination.children[dotIndex]);
     Object.assign(dot.style, {background: start.background, width: start.width, height: start.height});
     dot.animate([
      start,
      {width: nextStyle.width, height: nextStyle.height, background: nextStyle.backgroundColor, opacity: nextStyle.opacity}
     ], timing);
    });
    layer.appendChild(clone);
    return clone.animate([
     {left: `${source.position.left}px`, top: `${source.position.top}px`, width: `${source.width}px`, height: `${source.height}px`, borderColor: source.color, opacity: source.opacity},
     {left: `${target.left}px`, top: `${target.top}px`, width: `${destination.offsetWidth}px`, height: `${destination.offsetHeight}px`, borderWidth: targetStyle.borderWidth, borderColor: targetStyle.borderColor, opacity: incoming ? '1' : getComputedStyle(destination.parentElement).opacity}
    ], timing);
   });
   agenda.classList.add('cover-map-morphing');
   overlay.classList.add('map-morphing');
   Promise.all(animations.map(animation => animation.finished.catch(() => {}))).then(() => {
    if (mapMorphLayer === layer) finishMapMorph();
   });
  }
  deck.on('slidechanged', morphOpeningMap);
  deck.on('resize', finishMapMorph);
  deck.on('resize', alignTemplate);
  deck.on('resize', fitReferences);
  deck.on('resize', fitActorTables);
  deck.on('pdf-ready', fitActorTables);
  deck.on('pdf-ready', fitReferences);
  deck.on('overviewshown', () => { finishMapMorph(); overlay.hidden = true; });
  deck.on('overviewhidden', refresh);
  overlay.hidden = true;
  refresh();
 }
 window.addEventListener('load', () => {
  if (Reveal.isReady()) initializeNavigation();
  else Reveal.on('ready', initializeNavigation);
 }, {once: true});
})();
</script>
